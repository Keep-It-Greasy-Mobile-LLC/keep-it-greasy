name: Sync Google Photos Gallery

on:
  schedule:
    - cron: '0 3 * * *' # Runs every night at 3:00 AM UTC
  workflow_dispatch: # Allows manual runs from GitHub UI

jobs:
  sync-photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push committed changes back to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node: '20'

      - name: Run diagnostic token test
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: node scripts/test-token.js

      - name: Run sync script
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_ALBUM_ID: ${{ secrets.GOOGLE_ALBUM_ID }}
        run: node scripts/sync-photos.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/images/gallery/ src/gallery-images.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-sync Google Photos gallery [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
