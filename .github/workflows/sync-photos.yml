name: Sync Google Drive Gallery

on:
  schedule:
    - cron: '0 3 * * *' # Runs every night at 3:00 AM UTC
  workflow_dispatch: # Allows manual runs from GitHub Actions UI

jobs:
  sync-gdrive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gdown
        run: pip install gdown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download photos from Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/sync-gdrive.py

      - name: Rebuild gallery index
        run: node scripts/generate-gallery-json.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/images/gallery/ src/gallery-images.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-sync Google Drive gallery [skip ci]"
            git push
          else
            echo "No new photos found. Everything up to date."
          fi
